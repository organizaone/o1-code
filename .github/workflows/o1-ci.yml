# o1-code CI, the project's only workflow. Every pull request to main and
# every push to it run the fast gates, which the branch protection requires;
# the full core and cli suites run on demand, since on every push they would
# spend the private repository's minutes in a few days.
#
# A change that touches only documentation gets the documentation checks and
# nothing else: the job keeps its name, so the required check still reports,
# but it finishes in a couple of minutes instead of twenty.
name: 'o1-code CI'

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the full core and cli suites'
        type: 'boolean'
        default: false

# A merge to main must not cancel a full run someone started by hand.
concurrency:
  group: 'o1-ci-${{ github.ref }}-${{ github.event_name }}'
  cancel-in-progress: true

permissions:
  contents: 'read'

jobs:
  fast:
    name: 'Fast gates'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    env:
      # The core typecheck outgrows Node's default heap on a hosted runner.
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          fetch-depth: 1

      # Documentation only: every changed file is Markdown, lives under docs/,
      # or is a license or notice file. Anything else (code, configuration,
      # brand.json, lockfile, this workflow) is a code change. A manual run and
      # a push whose base is unknown count as code.
      - name: 'Classify the change'
        id: 'change'
        env:
          EVENT: '${{ github.event_name }}'
          BASE_SHA: '${{ github.event.pull_request.base.sha || github.event.before }}'
        run: |
          docs_only=false
          if [ "$EVENT" = 'pull_request' ] || [ "$EVENT" = 'push' ]; then
            if [ -n "$BASE_SHA" ] && ! printf '%s' "$BASE_SHA" | grep -q '^0*$'; then
              if git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
                changed="$(git diff --name-only "$BASE_SHA" HEAD)"
                if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '(^|/)[^/]+\.md$|^docs/|^LICENSE$|^NOTICE$|^[^/]+/LICENSE$|^[^/]+/NOTICE$|^packages/[^/]+/(LICENSE|NOTICE)$' >/dev/null; then
                  docs_only=true
                fi
                printf 'Changed files:\n%s\n' "$changed"
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation only: $docs_only"

      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Documentation checks'
        if: "${{ steps.change.outputs.docs_only == 'true' }}"
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha || github.event.before }}'
        run: |
          git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD | grep -E '\.md$' | xargs -r npx prettier --check
          node scripts/o1/brand-lint.mjs
          node scripts/o1/check-guides.mjs

      - name: 'Build'
        if: "${{ steps.change.outputs.docs_only != 'true' }}"
        run: |
          npm run build -- --cli-only
          npm run bundle

      - name: 'Typecheck'
        if: "${{ steps.change.outputs.docs_only != 'true' }}"
        run: 'npm run typecheck'

      - name: 'Lint'
        if: "${{ steps.change.outputs.docs_only != 'true' }}"
        run: 'npm run lint'

      - name: 'Fork script tests'
        if: "${{ steps.change.outputs.docs_only != 'true' }}"
        run: 'node --test scripts/o1/*.test.mjs'

      - name: 'Inherited script tests'
        if: "${{ steps.change.outputs.docs_only != 'true' }}"
        run: 'npm run test:scripts'

      # Web Shell unit tests; build-artifact tests read the bundle built above.
      - name: 'Web Shell tests'
        if: "${{ steps.change.outputs.docs_only != 'true' }}"
        working-directory: 'packages/web-shell'
        run: 'npx vitest run --config vitest.config.ts'

      - name: 'Brand lint'
        if: "${{ steps.change.outputs.docs_only != 'true' }}"
        run: 'node scripts/o1/brand-lint.mjs'

      - name: 'Smoke'
        if: "${{ steps.change.outputs.docs_only != 'true' }}"
        run: |
          node scripts/o1/smoke.mjs
          node scripts/o1/provider-smoke.mjs

  full:
    name: 'Full suites'
    needs: 'fast'
    if: '${{ inputs.full }}'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 180
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'

      # Some suites drive a real tmux or build zip packages.
      - name: 'System tools'
        run: 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tmux zip unzip'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Build'
        run: 'npm run build -- --cli-only'

      - name: 'Git identity for the suites that commit'
        run: |
          git config --global user.name 'o1-code CI'
          git config --global user.email 'ci@o1-code.local'

      - name: 'core'
        working-directory: 'packages/core'
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: 'npx vitest run'

      - name: 'cli'
        if: '${{ !cancelled() }}'
        working-directory: 'packages/cli'
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: 'npx vitest run'

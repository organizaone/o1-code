# o1-code CI, the project's only build workflow. Every pull request to main
# and every merge group run the fast gates, which the branch protection
# requires; the gates are separate jobs, so a failure re-runs only the job
# that failed. A push to main only builds and publishes the bundle artifact:
# the change was already validated as a pull request and in the merge queue,
# and the release workflow restores the artifact instead of building again.
# The full suites run on demand, one matrix job per package, since on every
# push they would hold the two self-hosted runners for hours.
#
# A change that touches only documentation gets the documentation checks and
# nothing else: the summary job keeps its name, so the required check still
# reports, but it finishes in a couple of minutes instead of twenty.
#
# Fork pull requests never run on these runners: the classifier fails the
# summary job instead, and the maintainer merges a reviewed fork contribution
# manually. The guard is dormant while the repository is private, since every
# pull request then comes from the repository itself.
name: 'o1-code CI'

on:
  pull_request:
    branches: ['main']
  merge_group:
    types: ['checks_requested']
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the full suites'
        type: 'boolean'
        default: false

# A merge to main must not cancel a full run someone started by hand.
concurrency:
  group: 'o1-ci-${{ github.ref }}-${{ github.event_name }}'
  cancel-in-progress: true

permissions:
  contents: 'read'

jobs:
  classify:
    name: 'Classify the change'
    # The repository variable CI_RUNNER_LABELS picks the runner, as a JSON
    # array of labels: ["self-hosted","dokploy"] for the maintainer's runners,
    # ["ubuntu-latest"] for GitHub's. Changing it needs no pull request.
    # The pinned action versions run on Node 24, which a self-hosted runner
    # only provides from application version 2.327.1.
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 10
    outputs:
      docs_only: '${{ steps.change.outputs.docs_only }}'
      fork_pr: '${{ steps.change.outputs.fork_pr }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      # Documentation only: every changed file is Markdown, lives under docs/,
      # or is a license or notice file. Anything else (code, configuration,
      # brand.json, lockfile, this workflow) is a code change. A manual run,
      # a merge group and a push whose base is unknown count as code.
      - name: 'Classify the change'
        id: 'change'
        env:
          EVENT: '${{ github.event_name }}'
          BASE_SHA: '${{ github.event.pull_request.base.sha || github.event.before }}'
          HEAD_REPO: '${{ github.event.pull_request.head.repo.full_name }}'
          REPO: '${{ github.repository }}'
        run: |
          fork_pr=false
          if [ "$EVENT" = 'pull_request' ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            fork_pr=true
          fi
          docs_only=false
          if [ "$fork_pr" = 'false' ] && { [ "$EVENT" = 'pull_request' ] || [ "$EVENT" = 'push' ]; }; then
            if [ -n "$BASE_SHA" ] && ! printf '%s' "$BASE_SHA" | grep -q '^0*$'; then
              if git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
                changed="$(git diff --name-only "$BASE_SHA" HEAD)"
                if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '(^|/)[^/]+\.md$|^docs/|^LICENSE$|^NOTICE$|^[^/]+/LICENSE$|^[^/]+/NOTICE$|^packages/[^/]+/(LICENSE|NOTICE)$' >/dev/null; then
                  docs_only=true
                fi
                printf 'Changed files:\n%s\n' "$changed"
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "fork_pr=$fork_pr" >> "$GITHUB_OUTPUT"
          echo "Documentation only: $docs_only"
          echo "Fork pull request: $fork_pr"

  # Runs on every event except documentation-only changes: the pull request
  # and the merge group need the bundle, and a push to main publishes the
  # artifact that the release restores for the tagged commit.
  build:
    name: 'Build'
    needs: 'classify'
    if: "${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.fork_pr != 'true' }}"
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 45
    env:
      # The core typecheck outgrows Node's default heap on a hosted runner.
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Build'
        run: |
          npm run build -- --cli-only
          npm run bundle

      - name: 'Publish the build artifact'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'build'
          path: |
            dist/
            packages/*/dist/
          retention-days: 14
          if-no-files-found: 'error'

  # The gates below run on pull requests, merge groups and manual runs, never
  # on a push to main: the merge was already validated by then. Lint reads
  # only sources. Typecheck and the script tests consume the build through
  # the artifact: project references resolve declaration outputs under
  # packages/*/dist (TS6305 without them), and the core-subpath guard
  # resolves exports into the same directories.

  lint:
    name: 'Lint'
    needs: 'classify'
    if: "${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.fork_pr != 'true' && github.event_name != 'push' }}"
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 25
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Generate'
        run: 'npm run generate'

      - name: 'Lint'
        run: 'npm run lint'

  typecheck:
    name: 'Typecheck'
    needs: ['classify', 'build']
    if: "${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.fork_pr != 'true' && github.event_name != 'push' }}"
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 20
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Restore the build'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'build'
          path: '.'

      - name: 'Generate'
        run: 'npm run generate'

      - name: 'Typecheck'
        run: 'npm run typecheck'

  scripts:
    name: 'Script tests'
    needs: ['classify', 'build']
    if: "${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.fork_pr != 'true' && github.event_name != 'push' }}"
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 15
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Restore the build'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'build'
          path: '.'

      - name: 'Generate'
        run: 'npm run generate'

      - name: 'Fork script tests'
        run: 'node --test scripts/o1/*.test.mjs'

      - name: 'Inherited script tests'
        run: 'npm run test:scripts'

  # Web Shell unit tests and the smoke scripts consume the bundle from the
  # build job instead of building it again.

  web-shell:
    name: 'Web Shell tests'
    needs: ['classify', 'build']
    if: "${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.fork_pr != 'true' && github.event_name != 'push' }}"
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 25
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Restore the build'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'build'
          path: '.'

      - name: 'Web Shell tests'
        working-directory: 'packages/web-shell'
        run: 'npx vitest run --config vitest.config.ts'

  smoke:
    name: 'Brand and smoke'
    needs: ['classify', 'build']
    if: "${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.fork_pr != 'true' && github.event_name != 'push' }}"
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 15
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Restore the build'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'build'
          path: '.'

      - name: 'Brand lint'
        run: 'node scripts/o1/brand-lint.mjs'

      - name: 'Smoke'
        run: |
          node scripts/o1/smoke.mjs
          node scripts/o1/provider-smoke.mjs

  docs:
    name: 'Documentation checks'
    needs: 'classify'
    if: "${{ needs.classify.outputs.docs_only == 'true' && needs.classify.outputs.fork_pr != 'true' && github.event_name != 'push' }}"
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 15
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Documentation checks'
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha || github.event.before }}'
        run: |
          git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD | grep -E '\.md$' | xargs -r npx prettier --check
          node scripts/o1/brand-lint.mjs
          node scripts/o1/check-guides.mjs

  # The required check. It always reports on pull requests, merge groups and
  # manual runs, and fails closed: a failed or cancelled gate, or a fork pull
  # request, fails here instead of leaving the check silently skipped.
  fast:
    name: 'Fast gates'
    needs:
      [
        'classify',
        'build',
        'lint',
        'typecheck',
        'scripts',
        'web-shell',
        'smoke',
        'docs',
      ]
    if: "${{ always() && github.event_name != 'push' }}"
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 5
    steps:
      - name: 'Report the gates'
        env:
          FORK_PR: '${{ needs.classify.outputs.fork_pr }}'
          RESULTS: '${{ toJSON(needs.*.result) }}'
        run: |
          if [ "$FORK_PR" = 'true' ]; then
            echo "::error::Fork pull requests do not run on these runners; the maintainer merges reviewed fork contributions manually"
            exit 1
          fi
          if printf '%s' "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::A fast gate did not pass: $RESULTS"
            exit 1
          fi
          echo "All fast gates passed: $RESULTS"

  # One job per package: independent, re-runnable, and the packages that
  # never had CI (sdk-typescript, acp-bridge, node-repl, vscode-ide-companion,
  # audio-capture) finally run their suites. Vitest transforms TypeScript
  # itself, so only core and cli, whose suites assert on built output, run
  # the build first.
  full:
    name: 'Full suites (${{ matrix.package }})'
    needs: 'fast'
    if: '${{ inputs.full }}'
    strategy:
      fail-fast: false
      matrix:
        package:
          - 'core'
          - 'cli'
          - 'sdk-typescript'
          - 'acp-bridge'
          - 'node-repl'
          - 'vscode-ide-companion'
          - 'audio-capture'
    runs-on: '${{ fromJSON(vars.CI_RUNNER_LABELS || ''["ubuntu-latest"]'') }}'
    timeout-minutes: 180
    env:
      NODE_OPTIONS: '--max-old-space-size=3072'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # Some suites drive a real tmux or build zip packages. The self-hosted
      # runners carry them already and have no sudo.
      - name: 'System tools'
        if: "${{ runner.environment == 'github-hosted' }}"
        run: 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tmux zip unzip'

      - name: 'Install'
        run: 'corepack pnpm install --frozen-lockfile'

      - name: 'Build'
        if: "${{ matrix.package == 'core' || matrix.package == 'cli' }}"
        run: 'npm run build -- --cli-only'

      - name: 'Git identity for the suites that commit'
        run: |
          git config --global user.name 'o1-code CI'
          git config --global user.email 'ci@o1-code.local'

      - name: 'Suite'
        working-directory: 'packages/${{ matrix.package }}'
        run: 'npm run test:ci'
